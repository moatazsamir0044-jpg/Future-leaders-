name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: plpm-app

jobs:
  app:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders. The app reads its Supabase configuration from
      # the environment and refuses to start without it; nothing here reaches a
      # real project.
      NEXT_PUBLIC_SUPABASE_URL: https://ci.example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plpm-app/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit (high and above)
        run: npm audit --audit-level=high

  database:
    name: Migrations and RLS policies
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # Builds a database from supabase/migrations and asserts that the RLS
      # policies and workflow triggers actually refuse what the UI hides:
      # self-promotion to admin, non-admin approvals, edits to approved sheets.
      - name: Apply migrations and run policy tests
        run: ./supabase/tests/run.sh
